<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nodely Poster · TikTok connected</title>
<link rel="icon" href="img/icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a href="index.html"><img src="img/icon.png" alt=""><span>Nodely</span></a>
</header>
<main>
  <h1 id="title">TikTok login</h1>
  <p id="msg" class="muted">Reading the response…</p>
  <p class="muted">Copy this page's full address from the browser's address bar and paste it into <code>tools/tiktok_auth.py</code>. This page sends nothing anywhere: the code stays in your address bar.</p>
</main>
<script>
  // Shows whether TikTok approved the login. The code itself never leaves the
  // address bar: the poster's setup script reads it from the pasted address.
  const q = new URLSearchParams(location.search);
  const title = document.getElementById('title');
  const msg = document.getElementById('msg');
  if (q.get('code')) {
    title.textContent = 'TikTok connected ✓';
    msg.textContent = 'Login approved. Copy the address now; the code works for a few minutes only.';
  } else if (q.get('error')) {
    title.textContent = 'TikTok login cancelled';
    msg.textContent = q.get('error_description') || q.get('error');
  } else {
    msg.textContent = 'This page is where TikTok returns after you log in to Nodely Poster.';
  }
</script>
</body>
</html>
